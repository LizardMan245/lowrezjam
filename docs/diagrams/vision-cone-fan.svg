<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="t d">
  <title id="t">Seven ray origins spread across the aperture</title>
  <desc id="d">The robot's eye is a horizontal bar of seven dots rather than a single point. Each dot casts its own fan of rays covering the same angular span, so the three fans shown are offset copies of one another. A dashed pair of lines marks the fan span, which reaches wider than the authored cone.</desc>
  <style>
    .bg    { fill: #ffffff; }
    .txt   { fill: #1f2328; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mut   { fill: #656d76; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acct  { fill: #1a5fd0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .occt  { fill: #a04a06; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inks  { stroke: #1f2328; }
    .muts  { stroke: #656d76; }
    .acc   { stroke: #2f6fed; }
    .accf  { fill: #2f6fed; }
    .occs  { stroke: #b35309; }
    .shade { fill: #2f6fed; fill-opacity: 0.09; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .txt   { fill: #e6edf3; }
      .mut   { fill: #9aa4ae; }
      .acct  { fill: #6ea8ff; }
      .occt  { fill: #e0913f; }
      .inks  { stroke: #e6edf3; }
      .muts  { stroke: #9aa4ae; }
      .acc   { stroke: #6ea8ff; }
      .accf  { fill: #6ea8ff; }
      .occs  { stroke: #e0913f; }
      .shade { fill: #6ea8ff; fill-opacity: 0.13; }
    }
  </style>
  <defs>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-end">
      <path class="inks" fill="none" stroke-width="1.6" d="M 5 0.5 L 5 9.5"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="440"/>
  <text class="txt" x="16" y="28" font-size="14.5" font-weight="600">The eye is a bar, not a point</text>
  <text class="mut" x="16" y="49" font-size="12.5">Seven origins spaced across aperture_width, each casting its own full fan.</text>
  <text class="mut" x="16" y="67" font-size="12.5">All fans span the same absolute angles, so their rows can share one texture.</text>

  <path class="shade" d="M 350 380 L 104.3 207.9 A 300 300 0 0 1 595.7 207.9 Z"/>

  <path class="muts" fill="none" stroke-width="1.1" stroke-opacity="0.75" d="M 250 380 L 4.3 207.9"/>
  <path class="muts" fill="none" stroke-width="1.1" stroke-opacity="0.75" d="M 250 380 L 495.7 207.9"/>
  <path class="muts" fill="none" stroke-width="1.1" stroke-opacity="0.75" d="M 4.3 207.9 A 300 300 0 0 1 495.7 207.9"/>

  <path class="muts" fill="none" stroke-width="1.1" stroke-opacity="0.75" d="M 450 380 L 204.3 207.9"/>
  <path class="muts" fill="none" stroke-width="1.1" stroke-opacity="0.75" d="M 450 380 L 695.7 207.9"/>
  <path class="muts" fill="none" stroke-width="1.1" stroke-opacity="0.75" d="M 204.3 207.9 A 300 300 0 0 1 695.7 207.9"/>

  <line class="acc" x1="350" y1="380" x2="104.3" y2="207.9" stroke-width="1.5"/>
  <line class="acc" x1="350" y1="380" x2="170.7" y2="139.5" stroke-width="1.5"/>
  <line class="acc" x1="350" y1="380" x2="255.8" y2="95.2" stroke-width="1.5"/>
  <line class="acc" x1="350" y1="380" x2="350" y2="80" stroke-width="1.5"/>
  <line class="acc" x1="350" y1="380" x2="444.2" y2="95.2" stroke-width="1.5"/>
  <line class="acc" x1="350" y1="380" x2="529.3" y2="139.5" stroke-width="1.5"/>
  <line class="acc" x1="350" y1="380" x2="595.7" y2="207.9" stroke-width="1.5"/>
  <path class="acc" fill="none" stroke-width="1.6" d="M 104.3 207.9 A 300 300 0 0 1 595.7 207.9"/>

  <line class="occs" x1="350" y1="380" x2="68.1" y2="277.4" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line class="occs" x1="350" y1="380" x2="631.9" y2="277.4" stroke-width="1.4" stroke-dasharray="6 4"/>

  <line class="inks" x1="250" y1="380" x2="450" y2="380" stroke-width="2.2"/>
  <circle class="accf" cx="250" cy="380" r="5"/>
  <circle class="accf" cx="283.3" cy="380" r="5"/>
  <circle class="accf" cx="316.7" cy="380" r="5"/>
  <circle class="accf" cx="350" cy="380" r="5"/>
  <circle class="accf" cx="383.3" cy="380" r="5"/>
  <circle class="accf" cx="416.7" cy="380" r="5"/>
  <circle class="accf" cx="450" cy="380" r="5"/>

  <line class="inks" x1="250" y1="405" x2="450" y2="405" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text class="txt" x="350" y="426" font-size="13" text-anchor="middle">aperture_width — 1.4 m across 7 origins</text>

  <text class="acct" x="350" y="200" font-size="13" text-anchor="middle">centre origin, fan drawn in full</text>
  <text class="mut" x="120" y="184" font-size="12" text-anchor="middle">outer origins</text>
  <text class="occt" x="60" y="296" font-size="12.5" text-anchor="start">fan_half_angle</text>
  <text class="occt" x="640" y="296" font-size="12.5" text-anchor="end">= half_angle + fan_margin</text>
  <text class="mut" x="350" y="62" font-size="12" text-anchor="middle"> </text>
</svg>
