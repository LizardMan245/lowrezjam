<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="t d">
  <title id="t">Vision cone ray fan</title>
  <desc id="d">A 90 degree cone spreads to the right from the robot's eye. Thirteen evenly spaced rays reach the 20 metre outer arc, except four that stop at a wall; the wedge behind the wall is shaded to mark the shadow.</desc>
  <style>
    .bg    { fill: #ffffff; }
    .txt   { fill: #1f2328; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mut   { fill: #656d76; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .occt  { fill: #a04a06; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acct  { fill: #1a5fd0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inks  { stroke: #1f2328; }
    .muts  { stroke: #656d76; }
    .acc   { stroke: #2f6fed; }
    .accf  { fill: #2f6fed; }
    .occ   { fill: #b35309; }
    .occs  { stroke: #b35309; }
    .shade { fill: #1f2328; fill-opacity: 0.10; }
    .cell  { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .txt   { fill: #e6edf3; }
      .mut   { fill: #9aa4ae; }
      .occt  { fill: #e0913f; }
      .acct  { fill: #6ea8ff; }
      .inks  { stroke: #e6edf3; }
      .muts  { stroke: #9aa4ae; }
      .acc   { stroke: #6ea8ff; }
      .accf  { fill: #6ea8ff; }
      .occ   { fill: #e0913f; }
      .occs  { stroke: #e0913f; }
      .shade { fill: #e6edf3; fill-opacity: 0.10; }
      .cell  { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-end">
      <path class="accf" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="marrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-end">
      <path class="mut" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-end">
      <path class="inks" fill="none" stroke-width="1.6" d="M 5 0.5 L 5 9.5"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="470"/>
  <text class="txt" x="16" y="30" font-size="14.5" text-anchor="start" font-weight="600">The ray fan, one physics frame</text>
  <text class="mut" x="16" y="51" font-size="12.5" text-anchor="start">128 rays are cast across the cone; 13 shown.</text>
  <text class="mut" x="16" y="69" font-size="12.5" text-anchor="start">Orange rays hit the wall and record a shorter distance.</text>
  <path class="acc" fill="none" stroke-width="1.5" stroke-dasharray="5 4" d="M 80 262 L 256.78 85.22 A 250 250 0 0 1 256.78 438.78 Z"/>
  <path class="shade" d="M 200 160 L 270.48 100.09 A 250 250 0 0 1 321.56 197.58 L 200 230 Z"/>
  <line class="acc" x1="80" y1="262" x2="256.78" y2="85.22" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="occs" x1="80" y1="262" x2="200" y2="169.92" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle class="occ" cx="200" cy="169.92" r="3.4"/>
  <line class="occs" x1="80" y1="262" x2="200" y2="192.72" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle class="occ" cx="200" cy="192.72" r="3.4"/>
  <line class="occs" x1="80" y1="262" x2="200" y2="212.29" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle class="occ" cx="200" cy="212.29" r="3.4"/>
  <line class="occs" x1="80" y1="262" x2="200" y2="229.85" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle class="occ" cx="200" cy="229.85" r="3.4"/>
  <line class="acc" x1="80" y1="262" x2="327.86" y2="229.37" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="330" y2="262" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="327.86" y2="294.63" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="321.48" y2="326.7" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="310.97" y2="357.67" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="296.51" y2="387" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="278.34" y2="414.19" stroke-width="1.6" stroke-opacity="0.9"/>
  <line class="acc" x1="80" y1="262" x2="256.78" y2="438.78" stroke-width="1.6" stroke-opacity="0.9"/>
  <rect class="occ" x="200" y="160" width="9" height="70" rx="2"/>
  <path class="muts" fill="none" stroke-width="1.3" d="M 123.84 218.16 A 62 62 0 0 1 142 262"/>
  <rect class="bg" x="115.44" y="211.15" width="121.28" height="16.64" rx="3"/>
  <text class="mut" x="176.08" y="222.2" font-size="13" text-anchor="middle">half_angle = 45°</text>
  <line class="acc" x1="80" y1="262" x2="352" y2="262" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="acct" x="362" y="267" font-size="14" text-anchor="start">facing</text>
  <circle class="accf" cx="80" cy="262" r="6"/>
  <text class="txt" x="16" y="306" font-size="14" text-anchor="start">eye_pos</text>
  <text class="mut" x="16" y="325" font-size="12.5" text-anchor="start">eye_height = 2.0 m</text>
  <line class="muts" x1="396" y1="140" x2="208" y2="164" stroke-width="1" stroke-opacity="0.7"/>
  <text class="occt" x="402" y="138" font-size="14" text-anchor="start">wall</text>
  <text class="mut" x="402" y="157" font-size="12.5" text-anchor="start">occluder_mask = layer 1</text>
  <line class="muts" x1="396" y1="212" x2="226.16" y2="185.43" stroke-width="1" stroke-opacity="0.7"/>
  <text class="mut" x="402" y="208" font-size="13" text-anchor="start">shadow — nothing visible</text>
  <text class="mut" x="402" y="226" font-size="13" text-anchor="start">past the wall</text>
  <rect class="bg" x="228.77" y="423.76" width="143.75" height="16" rx="3"/>
  <text class="mut" x="300.64" y="434.39" font-size="12.5" text-anchor="middle">view_distance = 20 m</text>
</svg>
