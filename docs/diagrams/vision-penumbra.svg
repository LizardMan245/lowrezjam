<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="t d">
  <title id="t">Umbra and penumbra from a seven-origin aperture</title>
  <desc id="d">Seven ray origins on the left each cast their own shadow of one narrow occluder. The seven shadow bands are drawn overlapping; where all seven coincide, close behind the occluder, a small dark umbra triangle forms and comes to a point. Past that point no full shadow remains, only overlapping partial bands that spread and lighten with distance.</desc>
  <style>
    .bg    { fill: #ffffff; }
    .txt   { fill: #1f2328; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mut   { fill: #656d76; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acct  { fill: #1a5fd0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .occt  { fill: #a04a06; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inks  { stroke: #1f2328; }
    .muts  { stroke: #656d76; }
    .accf  { fill: #2f6fed; }
    .occ   { fill: #b35309; }
    .band  { fill: #1f2328; fill-opacity: 0.11; }
    .umbra { fill: #1f2328; fill-opacity: 0.30; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .txt   { fill: #e6edf3; }
      .mut   { fill: #9aa4ae; }
      .acct  { fill: #6ea8ff; }
      .occt  { fill: #e0913f; }
      .inks  { stroke: #e6edf3; }
      .muts  { stroke: #9aa4ae; }
      .accf  { fill: #6ea8ff; }
      .occ   { fill: #e0913f; }
      .band  { fill: #e6edf3; fill-opacity: 0.10; }
      .umbra { fill: #e6edf3; fill-opacity: 0.26; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="700" height="400"/>
  <text class="txt" x="16" y="26" font-size="14.5" font-weight="600">Soft shadow is not blurred — it is counted</text>
  <text class="mut" x="16" y="46" font-size="12.5">Each origin casts one hard shadow. A pixel's brightness is how many of the seven miss it.</text>

  <path class="band" d="M 300 185 L 650 243.33 L 650 323.33 L 300 215 Z"/>
  <path class="band" d="M 300 185 L 650 215.56 L 650 295.56 L 300 215 Z"/>
  <path class="band" d="M 300 185 L 650 187.78 L 650 267.78 L 300 215 Z"/>
  <path class="band" d="M 300 185 L 650 160.00 L 650 240.00 L 300 215 Z"/>
  <path class="band" d="M 300 185 L 650 132.22 L 650 212.22 L 300 215 Z"/>
  <path class="band" d="M 300 185 L 650 104.44 L 650 184.44 L 300 215 Z"/>
  <path class="band" d="M 300 185 L 650 76.67 L 650 156.67 L 300 215 Z"/>
  <path class="umbra" d="M 300 185 L 390 200 L 300 215 Z"/>

  <line class="muts" x1="90" y1="150" x2="650" y2="243.33" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line class="muts" x1="90" y1="250" x2="650" y2="156.67" stroke-width="1.1" stroke-dasharray="5 4"/>

  <line class="inks" x1="90" y1="150" x2="90" y2="250" stroke-width="2.2"/>
  <circle class="accf" cx="90" cy="150" r="4.5"/>
  <circle class="accf" cx="90" cy="166.67" r="4.5"/>
  <circle class="accf" cx="90" cy="183.33" r="4.5"/>
  <circle class="accf" cx="90" cy="200" r="4.5"/>
  <circle class="accf" cx="90" cy="216.67" r="4.5"/>
  <circle class="accf" cx="90" cy="233.33" r="4.5"/>
  <circle class="accf" cx="90" cy="250" r="4.5"/>
  <text class="acct" x="90" y="272" font-size="13" text-anchor="middle">7 origins</text>
  <text class="mut" x="90" y="290" font-size="12" text-anchor="middle">aperture_width</text>

  <rect class="occ" x="295" y="185" width="10" height="30" rx="2"/>
  <text class="occt" x="300" y="176" font-size="13" text-anchor="middle">prop</text>

  <circle class="inks" fill="none" cx="390" cy="200" r="4" stroke-width="1.5"/>
  <text class="txt" x="404" y="196" font-size="12.5" text-anchor="start">umbra ends here</text>
  <text class="mut" x="404" y="212" font-size="11.5" text-anchor="start">the outer two shadows stop overlapping</text>

  <text class="txt" x="322" y="205" font-size="11" text-anchor="start" font-weight="600"> </text>
  <text class="txt" x="656" y="204" font-size="12" text-anchor="start">3 of 7</text>
  <text class="txt" x="656" y="150" font-size="12" text-anchor="start">1 of 7</text>
  <text class="txt" x="656" y="262" font-size="12" text-anchor="start">1 of 7</text>

  <text class="txt" x="16" y="358" font-size="13">A prop narrower than the aperture loses its umbra entirely past b = W·a / (W − O).</text>
  <text class="mut" x="16" y="378" font-size="12.5">With aperture 1.4 m, a 0.4 m crate 4 m away casts full shadow only out to 5.6 m — then it is a smudge.</text>
</svg>
