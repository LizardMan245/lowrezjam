<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="t d">
  <title id="t">The 128 by 7 range texture</title>
  <desc id="d">A grid with seven rows, one per ray origin, and nine of its 128 columns shown, one per ray angle. Most cells hold 20.0, the full view distance. In each row a pair of cells holds about 6, where that origin's rays hit a prop, and the shaded pair drifts one column to the right every couple of rows because each origin sees the prop from a slightly different angle.</desc>
  <style>
    .bg    { fill: #ffffff; }
    .txt   { fill: #1f2328; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mut   { fill: #656d76; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .occt  { fill: #a04a06; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acct  { fill: #1a5fd0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .muts  { stroke: #656d76; }
    .acc   { stroke: #2f6fed; }
    .hit   { fill: #b35309; fill-opacity: 0.16; }
    .num   { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hitn  { fill: #a04a06; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .txt   { fill: #e6edf3; }
      .mut   { fill: #9aa4ae; }
      .occt  { fill: #e0913f; }
      .acct  { fill: #6ea8ff; }
      .muts  { stroke: #9aa4ae; }
      .acc   { stroke: #6ea8ff; }
      .hit   { fill: #e0913f; fill-opacity: 0.20; }
      .num   { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hitn  { fill: #e0913f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="700" height="400"/>
  <text class="txt" x="16" y="28" font-size="14.5" font-weight="600">One row per origin, one column per angle</text>
  <text class="mut" x="16" y="48" font-size="12.5">FORMAT_RF, 128 × 7. Nine columns shown. Values are metres at which sight stops.</text>

  <text class="mut" x="394" y="86" font-size="12.5" text-anchor="middle">angle across the fan →</text>

  <rect class="hit" x="264" y="110" width="104" height="30"/>
  <rect class="hit" x="264" y="140" width="104" height="30"/>
  <rect class="hit" x="316" y="170" width="104" height="30"/>
  <rect class="hit" x="316" y="200" width="104" height="30"/>
  <rect class="hit" x="368" y="230" width="104" height="30"/>
  <rect class="hit" x="368" y="260" width="104" height="30"/>
  <rect class="hit" x="420" y="290" width="104" height="30"/>

  <g class="muts" stroke-width="1" fill="none">
    <path d="M 160 110 L 160 320 M 212 110 L 212 320 M 264 110 L 264 320 M 316 110 L 316 320 M 368 110 L 368 320 M 420 110 L 420 320 M 472 110 L 472 320 M 524 110 L 524 320 M 576 110 L 576 320 M 628 110 L 628 320"/>
    <path d="M 160 110 L 628 110 M 160 140 L 628 140 M 160 170 L 628 170 M 160 200 L 628 200 M 160 230 L 628 230 M 160 260 L 628 260 M 160 290 L 628 290 M 160 320 L 628 320"/>
  </g>

  <g class="num" font-size="11.5" text-anchor="middle">
    <text x="186" y="130">20.0</text><text x="238" y="130">20.0</text><text x="342" y="130" class="hitn">6.1</text><text x="290" y="130" class="hitn">6.4</text><text x="394" y="130">20.0</text><text x="446" y="130">20.0</text><text x="498" y="130">20.0</text><text x="550" y="130">20.0</text><text x="602" y="130">20.0</text>
    <text x="186" y="160">20.0</text><text x="238" y="160">20.0</text><text x="290" y="160" class="hitn">6.5</text><text x="342" y="160" class="hitn">6.2</text><text x="394" y="160">20.0</text><text x="446" y="160">20.0</text><text x="498" y="160">20.0</text><text x="550" y="160">20.0</text><text x="602" y="160">20.0</text>
    <text x="186" y="190">20.0</text><text x="238" y="190">20.0</text><text x="290" y="190">20.0</text><text x="342" y="190" class="hitn">6.3</text><text x="394" y="190" class="hitn">6.0</text><text x="446" y="190">20.0</text><text x="498" y="190">20.0</text><text x="550" y="190">20.0</text><text x="602" y="190">20.0</text>
    <text x="186" y="220">20.0</text><text x="238" y="220">20.0</text><text x="290" y="220">20.0</text><text x="342" y="220" class="hitn">6.4</text><text x="394" y="220" class="hitn">6.1</text><text x="446" y="220">20.0</text><text x="498" y="220">20.0</text><text x="550" y="220">20.0</text><text x="602" y="220">20.0</text>
    <text x="186" y="250">20.0</text><text x="238" y="250">20.0</text><text x="290" y="250">20.0</text><text x="342" y="250">20.0</text><text x="394" y="250" class="hitn">6.2</text><text x="446" y="250" class="hitn">5.9</text><text x="498" y="250">20.0</text><text x="550" y="250">20.0</text><text x="602" y="250">20.0</text>
    <text x="186" y="280">20.0</text><text x="238" y="280">20.0</text><text x="290" y="280">20.0</text><text x="342" y="280">20.0</text><text x="394" y="280" class="hitn">6.3</text><text x="446" y="280" class="hitn">6.0</text><text x="498" y="280">20.0</text><text x="550" y="280">20.0</text><text x="602" y="280">20.0</text>
    <text x="186" y="310">20.0</text><text x="238" y="310">20.0</text><text x="290" y="310">20.0</text><text x="342" y="310">20.0</text><text x="394" y="310">20.0</text><text x="446" y="310" class="hitn">6.1</text><text x="498" y="310" class="hitn">5.8</text><text x="550" y="310">20.0</text><text x="602" y="310">20.0</text>
  </g>

  <g class="mut" font-size="12" text-anchor="end">
    <text x="150" y="130">k = 0</text>
    <text x="150" y="160">k = 1</text>
    <text x="150" y="190">k = 2</text>
    <text x="150" y="220">k = 3</text>
    <text x="150" y="250">k = 4</text>
    <text x="150" y="280">k = 5</text>
    <text x="150" y="310">k = 6</text>
  </g>
  <text class="acct" x="150" y="102" font-size="12" text-anchor="end">origin</text>

  <line class="acc" x1="524" y1="300" x2="600" y2="344" stroke-width="1.3"/>
  <text class="occt" x="16" y="352" font-size="12.5">The shaded pair drifts right: each origin sees the same prop at a slightly different bearing.</text>
  <text class="mut" x="16" y="372" font-size="12.5">That drift is the whole effect — where the rows disagree, the pixel is in penumbra.</text>
  <text class="mut" x="16" y="390" font-size="12.5">Sampling at v = (k + 0.5) / 7 hits a row centre exactly, so filter_linear never blends two origins.</text>
</svg>
